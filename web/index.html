<!DOCTYPE html>
<html lang="es-MX">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MAVfin — Tus finanzas, tu progreso.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MAVfin">
  <meta name="theme-color" content="#FCFAF7">
  <!-- Fondo de la página = fondo de la app (2026-11-15). Safari pinta la
       franja de la hora con él; sin esto salía blanca en modo oscuro. Al
       arrancar, la app lo ajusta a la apariencia elegida
       (lib/plataforma/color_pagina.dart); esto cubre el primer instante. -->
  <style>
    html, body { background-color: #FCFAF7; }
    @media (prefers-color-scheme: dark) { html, body { background-color: #0A1424; } }
  </style>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MAVfin</title>
  <link rel="manifest" href="manifest.json">
  <!-- Sin ampliación automática (2026-11-15). Safari amplía la página al
       enfocar un campo con letra menor a 16 px y, en la app de la pantalla
       de inicio, se queda así: todo se veía cortado a la derecha. Flutter
       pone su propio viewport con maximum-scale=5.0 y reemplaza cualquiera
       de aquí, así que lo corregimos cada vez que lo toca. iOS sigue
       dejando ampliar con dos dedos (accesibilidad). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <script>
    (function () {
      var fijo = 'width=device-width, initial-scale=1.0, maximum-scale=1.0';
      function corregir() {
        document.querySelectorAll('meta[name=viewport]').forEach(function (m) {
          if (m.content !== fijo) m.content = fijo;
        });
      }
      new MutationObserver(corregir).observe(document.head, {
        childList: true, subtree: true, attributes: true, attributeFilter: ['content'],
      });
      corregir();
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    Gesto de regresar en iPhone: si el dedo empieza en el borde izquierdo,
    Safari arranca su propio "atrás" del historial al mismo tiempo que el
    deslizar de la app (Flutter, primeros 20 px), y las dos animaciones
    chocan. Se cancela el toque de Safari en esa franja; los eventos de
    puntero que usa Flutter siguen llegando, así que el gesto de la app
    queda solo y fluido.
  -->
  <script>
    document.addEventListener('touchstart', function (e) {
      if (e.touches.length === 1 && e.touches[0].clientX < 24) e.preventDefault();
    }, { passive: false });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

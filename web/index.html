<!DOCTYPE html>
<html lang="es-MX">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MAVfin — Tus finanzas, tu progreso.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MAVfin">
  <meta name="theme-color" content="#0B1F3B">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MAVfin</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    Gesto de regresar en iPhone: si el dedo empieza en el borde izquierdo,
    Safari arranca su propio "atrás" del historial al mismo tiempo que el
    deslizar de la app (Flutter, primeros 20 px), y las dos animaciones
    chocan. Se cancela el toque de Safari en esa franja; los eventos de
    puntero que usa Flutter siguen llegando, así que el gesto de la app
    queda solo y fluido.
  -->
  <script>
    document.addEventListener('touchstart', function (e) {
      if (e.touches.length === 1 && e.touches[0].clientX < 24) e.preventDefault();
    }, { passive: false });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
